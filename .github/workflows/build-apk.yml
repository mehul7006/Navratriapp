name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Restore release keystore (same signature every build)
        shell: pwsh
        run: |
          $ks = $env:KEYSTORE_BASE64
          if ([string]::IsNullOrWhiteSpace($ks)) { Write-Output 'No signing secrets - build falls back to debug keys'; exit 0 }
          [IO.File]::WriteAllBytes('android/upload-keystore.jks', [Convert]::FromBase64String($ks))
          @(
            "storePassword=$env:KEYSTORE_PASSWORD",
            "keyPassword=$env:KEY_PASSWORD",
            "keyAlias=$env:KEY_ALIAS",
            'storeFile=upload-keystore.jks'
          ) | Set-Content android/key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK (arm64 only, release)
        run: flutter build apk --split-per-abi --target-platform=android-arm64 --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
