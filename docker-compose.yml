version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: navratri_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: navratri_2026
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_default.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d navratri_2026"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # Dart API Server
  # ============================================
  api:
    build:
      context: ./api_server
      dockerfile: Dockerfile
    container_name: navratri_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PG_HOST: db
      PG_PORT: 5432
      PG_DATABASE: navratri_2026
      PG_USER: postgres
      PG_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  # ============================================
  # Flutter Web (nginx)
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: navratri_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

# ============================================
# Usage:
# 1. First build Flutter web:
#    flutter build web
# 2. Start everything:
#    docker-compose up -d --build
# 3. Stop:
#    docker-compose down
# 4. Reset DB:
#    docker-compose down -v && docker-compose up -d --build
# 5. App: http://localhost
#    API: http://localhost:8080
# ============================================

volumes:
  postgres_data:
