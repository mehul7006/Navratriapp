<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw</title>
<style>
  :root{
    --gold:#d8ab5f;
    --gold-light:#f0d199;
    --gold-dark:#9c7331;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(ellipse at 50% -10%, #232a3d 0%, #141724 55%, #0b0d15 100%);
    font-family:'Georgia','Cambria',serif;
    color:#eae6da;
    display:flex; align-items:flex-start; justify-content:center;
    padding:48px 16px 80px;
  }
  .stage{ width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; }
  .eyebrow{ letter-spacing:0.35em; font-size:11px; color:var(--gold); font-family:'Helvetica Neue',Arial,sans-serif; margin-bottom:6px; }
  h1{ font-weight:400; font-size:34px; margin:0 0 6px; color:#f5f1e6; text-align:center; }
  .sub{ font-family:'Helvetica Neue',Arial,sans-serif; color:#9aa0b4; font-size:14px; margin:0 0 30px; text-align:center; }

  .jar-wrap{ position:relative; width:300px; height:380px; }
  .jar-wrap.shaking{ animation: shake 0.26s ease-in-out 7; }
  @keyframes shake{
    0%,100%{ transform: rotate(0deg) translateX(0); }
    25%{ transform: rotate(-2.5deg) translateX(-5px); }
    75%{ transform: rotate(2.5deg) translateX(5px); }
  }
  svg{ display:block; width:100%; height:100%; overflow:visible; }

  .lid-metal{ fill:url(#brassGrad); }
  .lid-band{ fill:url(#brassGradDark); }
  .glass{
    fill:url(#glassGrad);
    stroke: rgba(225,238,248,0.6);
    stroke-width:2;
  }
  .glass-rim{
    fill:none;
    stroke: rgba(225,238,248,0.75);
    stroke-width:2;
  }
  .glass-shine{ fill: rgba(255,255,255,0.14); }
  .glass-shine-2{ fill: rgba(255,255,255,0.06); }
  .badge-title{ font-family:'Georgia',serif; fill:#8b90a0; font-size:12px; }
  .badge-text{ font-family:'Helvetica Neue',Arial,sans-serif; fill:#666b7a; font-size:8px; letter-spacing:0.16em; }

  .ticket-field{
    position:absolute;
    left:50%; top:63%;
    width:220px; height:230px;
    transform: translate(-50%,-50%);
    pointer-events:none;
  }
  .ticket{
    position:absolute;
    width:64px;
    padding:4px 7px;
    background: linear-gradient(180deg,#fdfaf1,#f3ecd8);
    border:1px solid rgba(0,0,0,0.12);
    border-radius:2px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:9.5px;
    font-weight:600;
    color:#3a3220;
    text-align:center;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    animation: settle 3.2s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes settle{
    0%,100%{ margin-top:0px; }
    50%{ margin-top:-4px; }
  }

  .flying-ticket{
    position:absolute;
    left:50%; top:16%;
    width:64px;
    padding:4px 7px;
    background: linear-gradient(180deg,#fdfaf1,#f3ecd8);
    border:1px solid rgba(0,0,0,0.12);
    border-radius:2px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:9.5px;
    font-weight:700;
    color:#3a3220;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    opacity:0;
    transform: translate(-50%,0) scale(0.5) rotate(0deg);
  }
  .flying-ticket.launch{
    animation: fly 1.1s cubic-bezier(.3,0,.2,1) forwards;
  }
  @keyframes fly{
    0%{ opacity:1; transform: translate(-50%,0) scale(0.6) rotate(0deg); }
    55%{ opacity:1; transform: translate(-50%,-92px) scale(1.05) rotate(-10deg); }
    100%{ opacity:1; transform: translate(-50%,-108px) scale(1) rotate(-4deg); }
  }

  .panel{ width:100%; max-width:400px; margin-top:14px; font-family:'Helvetica Neue',Arial,sans-serif; }
  textarea{
    width:100%; min-height:88px; resize:vertical;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(216,171,95,0.28);
    border-radius:10px; color:#eae6da; padding:12px 14px;
    font-size:14px; font-family:'Helvetica Neue',Arial,sans-serif; line-height:1.5; outline:none;
  }
  textarea::placeholder{ color:#5c6072; }
  textarea:focus{ border-color: var(--gold); }
  .count-row{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#7a7f92; margin-top:8px; }
  .count-row span:last-child{ text-decoration:underline; cursor:pointer; }

  .draw-btn{
    width:100%; margin-top:18px; padding:14px 0; border-radius:999px;
    border:1px solid var(--gold);
    background: linear-gradient(180deg, var(--gold-light), var(--gold) 60%, var(--gold-dark));
    color:#3c2a0c; font-family:'Helvetica Neue',Arial,sans-serif; font-weight:700; font-size:15px;
    cursor:pointer; box-shadow: 0 6px 18px rgba(216,171,95,0.22);
    transition: transform 0.12s ease;
  }
  .draw-btn:active{ transform: scale(0.98); }
  .draw-btn:disabled{ opacity:0.55; cursor:default; }

  .error-text{ color:#e3897f; font-size:12.5px; margin-top:8px; min-height:1em; }

  .winner-card{
    margin-top:22px; width:100%; border-radius:14px;
    border:1px solid rgba(216,171,95,0.35);
    background: linear-gradient(180deg, rgba(216,171,95,0.10), rgba(216,171,95,0.02));
    padding:20px 22px; text-align:center; display:none;
  }
  .winner-card.show{ display:block; animation: fadein 0.5s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .winner-card .label{ font-size:11px; letter-spacing:0.3em; color:var(--gold); margin-bottom:8px; }
  .winner-card .name{ font-family:'Georgia',serif; font-size:26px; color:#f5f1e6; }
  .reset-link{ margin-top:14px; text-align:center; font-size:13px; color:#7a7f92; text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>
<div class="stage">
  <div class="eyebrow">A World of Winners</div>
  <h1>Lucky Draw</h1>
  <p class="sub">Add every name to the jar, then give it a shake.</p>

  <div class="jar-wrap" id="jarWrap">
    <svg viewBox="0 0 300 380">
      <defs>
        <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f2d59a"/>
          <stop offset="45%" stop-color="#d8ab5f"/>
          <stop offset="100%" stop-color="#9c7331"/>
        </linearGradient>
        <linearGradient id="brassGradDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c9a06a"/>
          <stop offset="100%" stop-color="#8a6428"/>
        </linearGradient>
        <linearGradient id="glassGrad" x1="0.1" y1="0" x2="0.9" y2="1">
          <stop offset="0%" stop-color="rgba(215,232,242,0.20)"/>
          <stop offset="55%" stop-color="rgba(165,195,215,0.09)"/>
          <stop offset="100%" stop-color="rgba(130,160,182,0.16)"/>
        </linearGradient>
      </defs>

      <!-- lid -->
      <rect class="lid-band" x="86" y="30" width="128" height="34" rx="6"/>
      <rect class="lid-metal" x="80" y="18" width="140" height="18" rx="9"/>
      <rect class="lid-band" x="86" y="50" width="128" height="4" opacity="0.6"/>
      <rect class="lid-band" x="86" y="58" width="128" height="4" opacity="0.6"/>

      <!-- jar body: rounded rectangle jar with shoulders -->
      <path class="glass" d="
        M 96 64
        L 204 64
        L 204 88
        C 204 96 212 100 220 108
        C 236 124 246 148 246 176
        L 246 290
        C 246 316 224 336 198 336
        L 102 336
        C 76 336 54 316 54 290
        L 54 176
        C 54 148 64 124 80 108
        C 88 100 96 96 96 88
        Z"/>

      <ellipse class="glass-shine" cx="96" cy="150" rx="16" ry="90" transform="rotate(-4 96 150)"/>
      <ellipse class="glass-shine-2" cx="205" cy="230" rx="12" ry="60" transform="rotate(6 205 230)"/>

      <text class="badge-title" x="150" y="110" text-anchor="middle">Lucky Draw</text>
      <text class="badge-text" x="150" y="123" text-anchor="middle">A WORLD OF WINNERS</text>
    </svg>

    <div class="ticket-field" id="ticketField"></div>
    <div class="flying-ticket" id="flyingTicket"></div>
  </div>

  <div class="panel">
    <textarea id="namesInput" placeholder="Add names, one per line&#10;Asha Patel&#10;Ravi Shah&#10;Meera Joshi"></textarea>
    <div class="count-row">
      <span id="countLabel">0 names in the jar</span>
      <span id="clearLink">Clear</span>
    </div>
    <div class="error-text" id="errorText"></div>
    <button class="draw-btn" id="drawBtn">Draw a winner</button>

    <div class="winner-card" id="winnerCard">
      <div class="label">The winner is</div>
      <div class="name" id="winnerName">—</div>
    </div>
    <div class="reset-link" id="resetLink" style="display:none;">Draw again</div>
  </div>
</div>

<script>
  const namesInput = document.getElementById('namesInput');
  const countLabel = document.getElementById('countLabel');
  const clearLink = document.getElementById('clearLink');
  const drawBtn = document.getElementById('drawBtn');
  const errorText = document.getElementById('errorText');
  const ticketField = document.getElementById('ticketField');
  const jarWrap = document.getElementById('jarWrap');
  const flyingTicket = document.getElementById('flyingTicket');
  const winnerCard = document.getElementById('winnerCard');
  const winnerName = document.getElementById('winnerName');
  const resetLink = document.getElementById('resetLink');

  function getNames(){
    return namesInput.value.split('\n').map(s => s.trim()).filter(Boolean);
  }

  function renderTickets(){
    const names = getNames();
    countLabel.textContent = names.length + (names.length === 1 ? ' name in the jar' : ' names in the jar');
    ticketField.innerHTML = '';
    const shown = names.slice(0, 20);
    const cols = 4;
    shown.forEach((name, i) => {
      const t = document.createElement('div');
      t.className = 'ticket';
      t.textContent = name;
      const col = i % cols;
      const row = Math.floor(i / cols);
      const jitterX = (Math.random() * 16 - 8);
      const jitterY = (Math.random() * 10 - 5);
      const x = 14 + col * 50 + jitterX;
      const y = 30 + row * 32 + jitterY;
      t.style.left = Math.max(0, Math.min(155, x)) + 'px';
      t.style.top = Math.max(0, Math.min(195, y)) + 'px';
      t.style.transform = 'rotate(' + (Math.random() * 20 - 10) + 'deg)';
      t.style.animationDelay = (i * 0.12) + 's';
      ticketField.appendChild(t);
    });
    if (names.length > 20){
      const more = document.createElement('div');
      more.className = 'ticket';
      more.style.left = '60px';
      more.style.top = '198px';
      more.style.background = 'linear-gradient(180deg,#f0d199,#d8ab5f)';
      more.textContent = '+' + (names.length - 20) + ' more';
      ticketField.appendChild(more);
    }
  }

  namesInput.addEventListener('input', () => {
    errorText.textContent = '';
    renderTickets();
  });

  clearLink.addEventListener('click', () => {
    namesInput.value = '';
    errorText.textContent = '';
    renderTickets();
  });

  drawBtn.addEventListener('click', () => {
    const names = getNames();
    if (names.length < 2){
      errorText.textContent = 'Add at least two names to draw a winner.';
      return;
    }
    errorText.textContent = '';
    drawBtn.disabled = true;
    winnerCard.classList.remove('show');
    resetLink.style.display = 'none';
    flyingTicket.classList.remove('launch');
    flyingTicket.style.opacity = '0';

    jarWrap.classList.add('shaking');
    setTimeout(() => {
      jarWrap.classList.remove('shaking');
      const winner = names[Math.floor(Math.random() * names.length)];
      flyingTicket.textContent = winner;
      void flyingTicket.offsetWidth;
      flyingTicket.classList.add('launch');
      setTimeout(() => {
        winnerName.textContent = winner;
        winnerCard.classList.add('show');
        resetLink.style.display = 'block';
        drawBtn.disabled = false;
      }, 1000);
    }, 1650);
  });

  resetLink.addEventListener('click', () => {
    winnerCard.classList.remove('show');
    resetLink.style.display = 'none';
    flyingTicket.classList.remove('launch');
    flyingTicket.style.opacity = '0';
  });

  renderTickets();
</script>
</body>
</html>
